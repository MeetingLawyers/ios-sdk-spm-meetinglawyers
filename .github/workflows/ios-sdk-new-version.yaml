name: MeetingLawyersSDK New Version

permissions:
  contents: write

on:
  repository_dispatch:
    types: [new_version_created]
  workflow_dispatch:
    inputs:
      version:
        description: "SDK Version"
        required: true

jobs:
  new-version-created:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: main

      - name: Set SDK version from payload or manual input
        run: |
          if [ -z "${{ github.event.client_payload.tag }}" ]; then
            echo "SDK_VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "SDK_VERSION=${{ github.event.client_payload.tag }}" >> $GITHUB_ENV
          fi

      - name: Download MeetingLawyers SDK
        run: |
          SDK_URL="https://meetinglawyers-ios-sdk.s3.eu-west-3.amazonaws.com/sdk/${{ env.SDK_VERSION }}/MeetingLawyers_${{ env.SDK_VERSION }}.zip"
          curl -o MeetingLawyers.zip $SDK_URL

      - name: Calculate checksum for MeetingLawyers SDK
        id: checksum_meetinglawyers
        run: |
          CHECKSUM=$(swift package compute-checksum MeetingLawyers.zip)
          echo "MEETINGLAWYERS_CHECKSUM=$CHECKSUM" >> $GITHUB_ENV

      - name: Download MeetingLawyersNSE SDK
        run: |
          SDK_URL="https://meetinglawyers-ios-sdk.s3.eu-west-3.amazonaws.com/nse-sdk/${{ env.SDK_VERSION }}/MeetingLawyersNSE_${{ env.SDK_VERSION }}.zip"
          curl -o MeetingLawyersNSE.zip $SDK_URL

      - name: Calculate checksum for MeetingLawyersNSE SDK
        id: checksum_meetinglawyersnse
        run: |
          CHECKSUM=$(swift package compute-checksum MeetingLawyersNSE.zip)
          echo "MEETINGLAWYERSNSE_CHECKSUM=$CHECKSUM" >> $GITHUB_ENV

      # A release cut from a branch without MeetingLawyersCore must not make the package declare
      # it. The SDK pipeline says so in the payload; when nobody says, ask S3 for the zip.
      - name: Resolve whether this version ships MeetingLawyersCore
        run: |
          CORE_URL="https://meetinglawyers-ios-sdk.s3.eu-west-3.amazonaws.com/core-sdk/${{ env.SDK_VERSION }}/MeetingLawyersCore_${{ env.SDK_VERSION }}.zip"
          echo "MEETINGLAWYERSCORE_URL=$CORE_URL" >> $GITHUB_ENV

          DECLARED="${{ github.event.client_payload.core }}"
          if [ -n "$DECLARED" ]; then
            HAS_CORE="$DECLARED"
          elif curl -fsIL -o /dev/null "$CORE_URL"; then
            HAS_CORE=true
          else
            HAS_CORE=false
          fi

          echo "HAS_CORE=$HAS_CORE" >> $GITHUB_ENV
          echo "MeetingLawyersCore in ${{ env.SDK_VERSION }}: $HAS_CORE"

      - name: Download MeetingLawyersCore SDK
        if: env.HAS_CORE == 'true'
        run: |
          curl -f -o MeetingLawyersCore.zip "${{ env.MEETINGLAWYERSCORE_URL }}"

      - name: Calculate checksum for MeetingLawyersCore SDK
        if: env.HAS_CORE == 'true'
        run: |
          CHECKSUM=$(swift package compute-checksum MeetingLawyersCore.zip)
          echo "MEETINGLAWYERSCORE_CHECKSUM=$CHECKSUM" >> $GITHUB_ENV

      - name: Generate Package.swift from template
        env:
          TEMPLATE_PATH: "Template/Package.template.swift"
          OUTPUT_PATH: "Package.swift"
        run: |
          set -euo pipefail

          # Mantener o quitar las regiones de Core segun lo que publique esta version. Los patrones
          # van anclados a la linea de comentario entera (una mencion en prosa abriria el rango) y
          # con las barras escapadas (si no, cierran la direccion de sed).
          BEGIN='^[[:space:]]*\/\/ CORE-BEGIN$'
          END='^[[:space:]]*\/\/ CORE-END$'
          if [ "${{ env.HAS_CORE }}" = "true" ]; then
            sed -e "/$BEGIN/d" -e "/$END/d" $TEMPLATE_PATH > template.resolved
          else
            sed -e "/$BEGIN/,/$END/d" $TEMPLATE_PATH > template.resolved
          fi

          # Reemplazar los placeholders en la plantilla
          sed -e "s|{{MEETINGLAWYERS_URL}}|https://meetinglawyers-ios-sdk.s3.eu-west-3.amazonaws.com/sdk/${{ env.SDK_VERSION }}/MeetingLawyers_${{ env.SDK_VERSION }}.zip|g" \
              -e "s|{{MEETINGLAWYERS_CHECKSUM}}|${{ env.MEETINGLAWYERS_CHECKSUM }}|g" \
              -e "s|{{MEETINGLAWYERSNSE_URL}}|https://meetinglawyers-ios-sdk.s3.eu-west-3.amazonaws.com/nse-sdk/${{ env.SDK_VERSION }}/MeetingLawyersNSE_${{ env.SDK_VERSION }}.zip|g" \
              -e "s|{{MEETINGLAWYERSNSE_CHECKSUM}}|${{ env.MEETINGLAWYERSNSE_CHECKSUM }}|g" \
              -e "s|{{MEETINGLAWYERSCORE_URL}}|${{ env.MEETINGLAWYERSCORE_URL }}|g" \
              -e "s|{{MEETINGLAWYERSCORE_CHECKSUM}}|${{ env.MEETINGLAWYERSCORE_CHECKSUM }}|g" \
              template.resolved > $OUTPUT_PATH
          rm -f template.resolved

          # Un manifiesto truncado o con placeholders dejaria un Package.swift roto publicado
          if ! grep -q "^let package = Package(" $OUTPUT_PATH; then
            echo "Error: $OUTPUT_PATH is not a manifest"
            exit 1
          fi
          if grep -n "{{" $OUTPUT_PATH; then
            echo "Error: unresolved placeholders in $OUTPUT_PATH"
            exit 1
          fi
          if grep -n "CORE-BEGIN\|CORE-END" $OUTPUT_PATH; then
            echo "Error: leftover region markers in $OUTPUT_PATH"
            exit 1
          fi

          # Show Package.swift result
          echo "Generated Package.swift:"
          cat $OUTPUT_PATH

      - name: Commit and push changes
        if: "!contains(env.SDK_VERSION, 'beta') && !contains(env.SDK_VERSION, 'alpha')"
        env:
          SDK_VERSION: ${{ env.SDK_VERSION }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Package.swift

          # Si no hay cambios, salimos sin fallar
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update Package.swift for SDK version $SDK_VERSION"
          git push origin HEAD


      # --- PRERELEASE: commit y push a rama (beta/alpha) ---
      - name: Commit & push (prerelease → branch)
        if: "contains(env.SDK_VERSION, 'beta') || contains(env.SDK_VERSION, 'alpha')"
        env:
          SDK_VERSION: ${{ env.SDK_VERSION }}
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Package.swift

          if git diff --staged --quiet; then
            echo "No changes to commit (prerelease)."
            exit 0
          fi

          BRANCH="release/prerelease-$SDK_VERSION"
          git checkout -b "$BRANCH"
          git commit -m "chore: prerelease Package.swift for $SDK_VERSION"
          git push -u origin "$BRANCH"

      - name: Create new tag
        run: |
          git tag ${{ env.SDK_VERSION }}
          git push origin ${{ env.SDK_VERSION }}
